name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# Allow only one concurrent deployment, cancel in-progress runs
concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0  # Full history for accurate builds

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate podcast surfaces
        run: npm run test:podcasts

      - name: Build site
        run: npm run build:ci
        env:
          PODCAST_ADMIN_API_ORIGIN: ${{ vars.PODCAST_ADMIN_API_ORIGIN }}
          PODCAST_ADMIN_TURNSTILE_SITE_KEY: ${{ vars.PODCAST_ADMIN_TURNSTILE_SITE_KEY }}
          PODCAST_MEMBER_API_ORIGIN: ${{ vars.PODCAST_MEMBER_API_ORIGIN }}
          PODCAST_MEMBER_TURNSTILE_SITE_KEY: ${{ vars.PODCAST_MEMBER_TURNSTILE_SITE_KEY }}
          PODCAST_CHECKOUT_TURNSTILE_SITE_KEY: ${{ vars.PODCAST_CHECKOUT_TURNSTILE_SITE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000  # 10 minutes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge Cloudflare cache
        if: ${{ vars.CLOUDFLARE_ENABLED == 'true' }}
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}

  # Federate posts to the Fediverse via Bridgy Fed
  federate:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && vars.BRIDGY_FED_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 2  # Need previous commit to detect changes

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Send Bridgy Fed webmentions
        run: node scripts/ping-bridgy.mjs
