name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# Allow only one concurrent deployment, cancel in-progress runs
concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0  # Full history for accurate builds

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate podcast surfaces
        run: npm run check:podcasts

      - name: Build site
        run: npm run build:ci
        env:
          PODCAST_ADMIN_API_ORIGIN: ${{ vars.PODCAST_ADMIN_API_ORIGIN }}
          PODCAST_ADMIN_TURNSTILE_SITE_KEY: ${{ vars.PODCAST_ADMIN_TURNSTILE_SITE_KEY }}
          PODCAST_MEMBER_API_ORIGIN: ${{ vars.PODCAST_MEMBER_API_ORIGIN }}
          PODCAST_MEMBER_TURNSTILE_SITE_KEY: ${{ vars.PODCAST_MEMBER_TURNSTILE_SITE_KEY }}
          PODCAST_CHECKOUT_TURNSTILE_SITE_KEY: ${{ vars.PODCAST_CHECKOUT_TURNSTILE_SITE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 600000  # 10 minutes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout edge configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js for edge configuration
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Enforce Cloudflare authenticated-route headers
        if: ${{ vars.CLOUDFLARE_ENABLED == 'true' }}
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TRANSFORM_RULES_TOKEN: ${{ secrets.CLOUDFLARE_TRANSFORM_RULES_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}
        run: node scripts/cloudflare-response-headers.mjs

      - name: Purge Cloudflare cache
        if: ${{ vars.CLOUDFLARE_ENABLED == 'true' }}
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          if ! [[ "$CLOUDFLARE_ZONE" =~ ^[a-f0-9]{32}$ ]]; then
            echo "Cloudflare zone ID is missing or invalid."
            exit 1
          fi
          auth_headers=()
          if [ -n "$CLOUDFLARE_CACHE_PURGE_TOKEN" ]; then
            auth_headers+=("--header" "Authorization: Bearer $CLOUDFLARE_CACHE_PURGE_TOKEN")
          else
            if [ -z "$CLOUDFLARE_EMAIL" ] || [ -z "$CLOUDFLARE_KEY" ]; then
              echo "Cloudflare cache purge credentials are missing."
              exit 1
            fi
            auth_headers+=("--header" "X-Auth-Email: $CLOUDFLARE_EMAIL")
            auth_headers+=("--header" "X-Auth-Key: $CLOUDFLARE_KEY")
          fi
          response="$(
            curl --fail-with-body --silent --show-error \
              --retry 3 \
              --max-time 30 \
              --request POST \
              --header "Content-Type: application/json" \
              "${auth_headers[@]}" \
              --data '{"purge_everything":true}' \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE/purge_cache"
          )"
          CLOUDFLARE_RESPONSE="$response" node -e '
            const payload = JSON.parse(process.env.CLOUDFLARE_RESPONSE || "{}");
            if (payload.success !== true) {
              throw new Error("Cloudflare cache purge was not accepted");
            }
            console.log("Cloudflare cache purge accepted.");
          '

      - name: Verify production Podcast response headers
        if: ${{ vars.CLOUDFLARE_ENABLED == 'true' }}
        run: node scripts/verify-production-response-headers.mjs

  # Federate posts to the Fediverse via Bridgy Fed
  federate:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && vars.BRIDGY_FED_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 2  # Need previous commit to detect changes

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Send Bridgy Fed webmentions
        run: node scripts/ping-bridgy.mjs
