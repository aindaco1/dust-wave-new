media:
  input: src/img
  output: /img

content:
  # ═══════════════════════════════════════════════════════════
  # 👥 MEMBERS — Team member profiles (edits about.njk)
  # ═══════════════════════════════════════════════════════════
  - name: members
    label: 👥 Members
    type: collection
    path: src/members
    filename: "{slug}.md"
    view:
      fields: [name, column, order]
      primary: name
      sort: [column, order]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: Filename (slug)
        type: string
        required: true
        description: "⚠️ Lowercase with hyphens: 'ben-arndt' (no spaces, no caps)."

      - name: name
        label: Display Name
        type: string
        required: true
        description: "Full name as shown on site (e.g., 'Ben Arndt')."

      - name: img
        label: Photo
        type: image
        media:
          input: src/img/about
          output: /img/about
          path: /
        description: "Member photo. Size: 800×800px (1:1 square), under 200KB."

      - name: instagram
        label: Instagram Handle
        type: string
        description: "Instagram username (without @). Leave blank if none."

      - name: website
        label: Website
        type: string
        description: "Full website URL, including https://. Leave blank if none."

      - name: column
        label: Column
        type: select
        options:
          values:
            - value: left
              label: "Left Column"
            - value: right
              label: "Right Column"
        description: "Which column to display this member in."

      - name: order
        label: Display Order
        type: number
        description: "Order within the column (1 = top)."

  # ═══════════════════════════════════════════════════════════
  # 🎬 POSTS — Film projects and productions
  # ═══════════════════════════════════════════════════════════
  - name: posts
    label: 🎬 Film Projects
    type: collection
    path: src/posts
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        description: "The project title (e.g., 'Stall'd', 'The Haunters')."

      - name: date
        label: Release Date
        type: date
        description: "Release or premiere date."

      - name: img
        label: Featured Image
        type: image
        media:
          input: src/img/stills
          output: /img/stills
        description: "Main image for project page. Size: 1800×1012px (16:9), under 400KB."

      - name: summary
        label: Short Description
        type: string
        description: "One-line tagline (e.g., 'Romance drama short', 'Dark horror comedy')."

      - name: directors
        label: Director(s)
        type: string
        list: true
        description: "Film directors, one person per entry. Used for Movie structured data."

      - name: gif
        label: Hover GIF
        type: image
        media:
          input: src/img/gifs
          output: /img/gifs
        options:
          extensions: [gif]
        description: "Animated preview for homepage hover. Size: 800×450px (16:9), MAX 8MB (larger files fail silently), 3-4 second loop."

      - name: tags
        label: Tags
        type: select
        list: true
        options:
          creatable: true
          values:
            - value: released
              label: "✅ Released"
            - value: in-production
              label: "🎬 In Production"
            - value: coming-soon
              label: "🔜 Coming Soon"
            - value: comedy
              label: "Comedy"
            - value: drama
              label: "Drama"
            - value: horror
              label: "Horror"
            - value: sci-fi
              label: "Sci-Fi"
            - value: documentary
              label: "Documentary"
            - value: satire
              label: "Satire"
            - value: mockumentary
              label: "Mockumentary"
            - value: stop-motion
              label: "Stop-Motion"
            - value: silent
              label: "Silent"
            - value: musical
              label: "Musical"
            - value: noir
              label: "Noir"
            - value: romance
              label: "Romance"
            - value: festival
              label: "Festival/Event"
            - value: event
              label: "Event"
        description: "Select from existing tags or type to create new ones."

      - name: galleryImages
        label: Gallery Images
        type: image
        list: true
        media:
          input: src/img
          output: /img
        description: "Optional masonry gallery rendered below the page body. Upload/select project images from the relevant folder under src/img."

      - name: body
        label: Content
        type: code
        options:
          lang: markdown
        default: |
          <!-- ═══════════════════════════════════════════════════════════
               FILM PROJECT TEMPLATE
               Replace ALL CAPS placeholders with your content.
               Delete sections you don't need.
               ═══════════════════════════════════════════════════════════ -->

          _TITLE_ is a SHORT DESCRIPTION created for OCCASION. Shot at LOCATION in Albuquerque, New Mexico.

          <br>

          ### Crew

          Directed by NAME<br>
          Written by NAME<br>
          Produced by NAME<br>
          <br>
          Director of Photography -- NAME<br>
          Editor -- NAME<br>
          Sound -- NAME

          <br>

          ### Cast

          CHARACTER -- ACTOR<br>
          CHARACTER -- ACTOR

          <br>

          ### Awards

          [FESTIVAL NAME](https://example.com)
          * Award Name -- Recipient
          * **Best Film**

          <!-- ═══════════════════════════════════════════════════════════
               OPTIONAL EXTRAS (delete if not needed)
               ═══════════════════════════════════════════════════════════ -->

          <!-- INLINE IMAGE (use for special placement, otherwise use Gallery Images field above)
          <img src="/img/PROJECT/photo.jpg" alt="description">
          -->

          <!-- CENTERED IMAGE
          <center><img src="/img/PROJECT/photo.jpg" alt="description"></center>
          -->

          <!-- GALLERY
          Add images to the Gallery Images field instead of pasting layout HTML.
          Galleries render as a responsive masonry grid automatically.
          -->

          <!-- EXTERNAL LINK
          More info at [LINK TEXT](https://example.com)
          -->
        description: "Raw HTML/Markdown. Video and gallery auto-render from fields above."

  # ═══════════════════════════════════════════════════════════
  # 📢 NEWS — Standard announcements (HTML/Markdown editing)
  # ═══════════════════════════════════════════════════════════
  - name: news-regular
    label: 📢 News
    type: collection
    path: src/news
    subfolders: false
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        description: "Article headline (e.g., 'Bag Check selected at SISFA!')."

      - name: date
        label: Date
        type: date
        description: "Publication date."

      - name: summary
        label: Short Description
        type: string
        description: "One-sentence preview for listings (max 160 chars)."

      - name: img
        label: Header Image
        type: image
        media:
          input: src/img/news
          output: /img/news
        description: "Article header image. Size: 1600×900px (16:9), under 350KB."

      - name: galleryImages
        label: Gallery Images
        type: image
        list: true
        media:
          input: src/img
          output: /img
        description: "Optional masonry gallery rendered below the article body. Upload/select news images from the relevant folder under src/img."

      - name: body
        label: Article Content
        type: code
        options:
          lang: markdown
        default: |
          <!-- ═══════════════════════════════════════════════════════════
               NEWS ARTICLE TEMPLATE
               Replace ALL CAPS placeholders with your content.
               Delete sections you don't need.
               ═══════════════════════════════════════════════════════════ -->

          Congratulations to everyone involved in PROJECT NAME!

          <br>

          WRITE YOUR ANNOUNCEMENT HERE.

          <br>

          ### Links

          - [Project Page](/subdir/project-name/)
          - [External Site](https://example.com)

          <!-- ═══════════════════════════════════════════════════════════
               OPTIONAL EXTRAS (delete if not needed)
               ═══════════════════════════════════════════════════════════ -->

          <!-- CELEBRATION GIF
          <center><img src="/img/news/celebration.gif" alt="celebration"></center>
          -->

          <!-- INLINE IMAGE
          <img src="/img/news/photo.jpg" alt="description">
          -->

          <!-- CENTERED IMAGE
          <center><img src="/img/news/photo.jpg" alt="description"></center>
          -->

          <!-- GALLERY
          Add images to the Gallery Images field instead of pasting layout HTML.
          Galleries render as a responsive masonry grid automatically.
          -->

          <!-- BOLD/ITALIC TEXT
          **Bold text** and _italic text_
          -->

          <!-- BULLET LIST
          * Item one
          * Item two
          * Item three
          -->
        description: "Raw HTML/Markdown content."

  # ═══════════════════════════════════════════════════════════
  # 📜 DIY DIGESTS — Auto-generated weekly digests (code editing)
  # ═══════════════════════════════════════════════════════════
  - name: digests
    label: 📜 DIY Digests (⚠️ Edit Only - Do Not Create)
    type: collection
    path: src/news/digests
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        description: "Digest title (e.g., 'DIY Filmmaker Digest 8 -- Week of December 8, 2025')."

      - name: date
        label: Date
        type: date
        description: "Publication date."

      - name: summary
        label: Short Description
        type: string
        description: "One-sentence preview for listings."

      - name: img
        label: Header Image
        type: image
        media:
          input: src/img/digest/header
          output: /img/digest/header
        description: "Header image for the digest."

      - name: body
        label: Digest Content (HTML)
        type: code
        options:
          lang: html
        description: |
          ⚠️ **This is raw HTML** — edit carefully!
          
          Digest posts are auto-generated by scripts.
          Only make small text edits, don't restructure the HTML.
