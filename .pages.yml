settings:
  content:
    # Preserve frontmatter owned by templates or newer site features even when a
    # field has not yet been added to this editor configuration.
    merge: true

media:
  - name: images
    label: Site Images
    input: src/img
    output: /img
    categories: [image]

  - name: videos
    label: Site Videos
    input: src/img
    output: /img
    categories: [video]

content:
  # ═══════════════════════════════════════════════════════════
  # 👥 MEMBERS — Team member profiles (edits about.njk)
  # ═══════════════════════════════════════════════════════════
  - name: members
    label: 👥 Members
    type: collection
    path: src/members
    filename: "{fields.slug}.md"
    view:
      fields: [name, column, order]
      primary: name
      sort: [column, order]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: Filename (slug)
        type: string
        required: true
        description: "⚠️ Lowercase with hyphens: 'ben-arndt' (no spaces, no caps)."

      - name: name
        label: Display Name
        type: string
        required: true
        description: "Full name as shown on site (e.g., 'Ben Arndt')."

      - name: img
        label: Photo
        type: image
        required: true
        options:
          media: images
          path: src/img/about
        description: "Member photo. Size: 800×800px (1:1 square), under 200KB."

      - name: instagram
        label: Instagram Handle
        type: string
        description: "Instagram username (without @). Leave blank if none."

      - name: website
        label: Website
        type: string
        description: "Full website URL, including https://. Leave blank if none."

      - name: column
        label: Column
        type: select
        required: true
        options:
          values:
            - value: left
              label: "Left Column"
            - value: right
              label: "Right Column"
        description: "Which column to display this member in."

      - name: order
        label: Display Order
        type: number
        required: true
        description: "Order within the column (1 = top)."

  # ═══════════════════════════════════════════════════════════
  # 🎬 POSTS — Film projects and productions
  # ═══════════════════════════════════════════════════════════
  - name: posts
    label: 🎬 Film Projects (Edit Only)
    type: collection
    path: src/posts
    filename: "{primary}.md"
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The project title (e.g., 'Stall'd', 'The Haunters')."

      - name: date
        label: Release Date
        type: date
        required: true
        description: "Release or premiere date."

      - name: img
        label: Featured Image
        type: image
        required: true
        options:
          media: images
          path: src/img
        description: "Main project image or GIF. Usually stored in stills/, gifs/, or software/."

      - name: imgAlt
        label: Featured Image Alt Text
        type: string
        description: "Concise visual description for accessibility and social previews."

      - name: imgDisplay
        label: Featured Image Display
        type: select
        options:
          values:
            - value: compact
              label: Compact
        description: "Optional compact presentation for app icons and other square artwork."

      - name: summary
        label: Short Description
        type: string
        required: true
        description: "One-line tagline (e.g., 'Romance drama short', 'Dark horror comedy')."

      - name: directors
        label: Director(s)
        type: string
        list: true
        description: "Film directors, one person per entry. Used for Movie structured data."

      - name: hoverVideoWebm
        label: Hover Video (WebM)
        type: file
        options:
          media: videos
          path: src/img/project-videos
          extensions: [webm]
        description: "WebM homepage hover preview."

      - name: hoverVideoMp4
        label: Hover Video (MP4)
        type: file
        options:
          media: videos
          path: src/img/project-videos
          extensions: [mp4]
        description: "MP4 fallback for the homepage hover preview."

      - name: hoverVideoPoster
        label: Hover Video Poster
        type: image
        options:
          media: images
          path: src/img
        description: "Static image shown before the hover video loads."

      - name: hoverVideoWrap
        label: Contain Hover Video
        type: boolean
        description: "Show the complete hover video inside its card instead of cropping it."

      - name: tags
        label: Tags
        type: string
        list: true
        required: true
        description: "Lowercase taxonomy tags, one per entry (for example: released, horror, music-video)."

      - name: galleryHeading
        label: Gallery Heading
        type: string
        description: "Optional heading shown above the primary gallery."

      - name: galleryImages
        label: Gallery Images
        type: object
        list:
          collapsible: true
        fields:
          - name: src
            label: Image
            type: image
            required: true
            options:
              media: images
              path: src/img
          - name: alt
            label: Alt Text
            type: string
            required: true
          - name: caption
            label: Caption
            type: string
        description: "Optional accessible masonry gallery rendered below the page body."

      - name: additionalGalleries
        label: Additional Galleries
        type: object
        list:
          collapsible: true
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: images
            label: Images
            type: object
            list:
              collapsible: true
            fields:
              - name: src
                label: Image
                type: image
                required: true
                options:
                  media: images
                  path: src/img
              - name: alt
                label: Alt Text
                type: string
                required: true
              - name: caption
                label: Caption
                type: string

      - name: poster
        label: Poster
        type: image
        options:
          media: images
          path: src/img

      - name: posterHeading
        label: Poster Heading
        type: string

      - name: posterAlt
        label: Poster Alt Text
        type: string

      - name: projectVideos
        label: Project Videos
        type: object
        list:
          collapsible: true
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: id
            label: YouTube or Vimeo ID
            type: string
            required: true
          - name: type
            label: Provider
            type: select
            required: true
            options:
              values:
                - value: youtube
                  label: YouTube
                - value: vimeo
                  label: Vimeo

      - name: movieComingSoon
        label: Show Movie Coming Soon
        type: boolean

      - name: movieHeading
        label: Movie Heading
        type: string

      - name: syndicate
        label: Syndication Targets
        type: select
        options:
          multiple: true
          values:
            - value: substack
              label: Substack
            - value: fediverse
              label: Fediverse

      - name: og_image
        label: Open Graph Image Override
        type: image
        options:
          media: images
          path: src/img

      - name: og_video
        label: Open Graph Video
        type: file
        options:
          media: videos
          path: src/img
          extensions: [mp4, webm]

      - name: og_alt
        label: Open Graph Alt Text
        type: string

      - name: share_text
        label: Social Share Text
        type: text

      - name: body
        label: Content
        type: code
        options:
          lang: markdown
        default: |
          <!-- ═══════════════════════════════════════════════════════════
               FILM PROJECT TEMPLATE
               Replace ALL CAPS placeholders with your content.
               Delete sections you don't need.
               ═══════════════════════════════════════════════════════════ -->

          _TITLE_ is a SHORT DESCRIPTION created for OCCASION. Shot at LOCATION in Albuquerque, New Mexico.

          <br>

          ### Crew

          Directed by NAME<br>
          Written by NAME<br>
          Produced by NAME<br>
          <br>
          Director of Photography -- NAME<br>
          Editor -- NAME<br>
          Sound -- NAME

          <br>

          ### Cast

          CHARACTER -- ACTOR<br>
          CHARACTER -- ACTOR

          <br>

          ### Awards

          [FESTIVAL NAME](https://example.com)
          * Award Name -- Recipient
          * **Best Film**

          <!-- ═══════════════════════════════════════════════════════════
               OPTIONAL EXTRAS (delete if not needed)
               ═══════════════════════════════════════════════════════════ -->

          <!-- INLINE IMAGE (use for special placement, otherwise use Gallery Images field above)
          <img src="/img/PROJECT/photo.jpg" alt="description">
          -->

          <!-- CENTERED IMAGE
          <center><img src="/img/PROJECT/photo.jpg" alt="description"></center>
          -->

          <!-- GALLERY
          Add images to the Gallery Images field instead of pasting layout HTML.
          Galleries render as a responsive masonry grid automatically.
          -->

          <!-- EXTERNAL LINK
          More info at [LINK TEXT](https://example.com)
          -->
        description: "Raw HTML/Markdown. Video and gallery auto-render from fields above."

  # ═══════════════════════════════════════════════════════════
  # 📢 NEWS — Standard announcements (HTML/Markdown editing)
  # ═══════════════════════════════════════════════════════════
  - name: news-regular
    label: 📢 News
    type: collection
    path: src/news
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Article headline (e.g., 'Bag Check selected at SISFA!')."

      - name: date
        label: Date
        type: date
        required: true
        description: "Publication date."

      - name: summary
        label: Short Description
        type: string
        required: true
        description: "One-sentence preview for listings (max 160 chars)."

      - name: img
        label: Header Image
        type: image
        required: true
        options:
          media: images
          path: src/img/news
        description: "Article header image. Size: 1600×900px (16:9), under 350KB."

      - name: imgAlt
        label: Header Image Alt Text
        type: string

      - name: author
        label: Author
        type: string

      - name: syndicate
        label: Syndication Targets
        type: select
        options:
          multiple: true
          values:
            - value: substack
              label: Substack
            - value: fediverse
              label: Fediverse

      - name: galleryImages
        label: Gallery Images
        type: image
        options:
          media: images
          path: src/img/news
          multiple: true
        description: "Optional masonry gallery rendered below the article body. Upload/select news images from the relevant folder under src/img."

      - name: og_image
        label: Open Graph Image Override
        type: image
        options:
          media: images
          path: src/img

      - name: og_video
        label: Open Graph Video
        type: file
        options:
          media: videos
          path: src/img
          extensions: [mp4, webm]

      - name: og_alt
        label: Open Graph Alt Text
        type: string

      - name: share_text
        label: Social Share Text
        type: text

      - name: body
        label: Article Content
        type: code
        options:
          lang: markdown
        default: |
          <!-- ═══════════════════════════════════════════════════════════
               NEWS ARTICLE TEMPLATE
               Replace ALL CAPS placeholders with your content.
               Delete sections you don't need.
               ═══════════════════════════════════════════════════════════ -->

          Congratulations to everyone involved in PROJECT NAME!

          <br>

          WRITE YOUR ANNOUNCEMENT HERE.

          <br>

          ### Links

          - [Project Page](/subdir/project-name/)
          - [External Site](https://example.com)

          <!-- ═══════════════════════════════════════════════════════════
               OPTIONAL EXTRAS (delete if not needed)
               ═══════════════════════════════════════════════════════════ -->

          <!-- CELEBRATION GIF
          <center><img src="/img/news/celebration.gif" alt="celebration"></center>
          -->

          <!-- INLINE IMAGE
          <img src="/img/news/photo.jpg" alt="description">
          -->

          <!-- CENTERED IMAGE
          <center><img src="/img/news/photo.jpg" alt="description"></center>
          -->

          <!-- GALLERY
          Add images to the Gallery Images field instead of pasting layout HTML.
          Galleries render as a responsive masonry grid automatically.
          -->

          <!-- BOLD/ITALIC TEXT
          **Bold text** and _italic text_
          -->

          <!-- BULLET LIST
          * Item one
          * Item two
          * Item three
          -->
        description: "Raw HTML/Markdown content."

  # ═══════════════════════════════════════════════════════════
  # 📜 DIY DIGESTS — Auto-generated weekly digests (code editing)
  # ═══════════════════════════════════════════════════════════
  - name: digests
    label: 📜 DIY Digests (⚠️ Edit Only - Do Not Create)
    type: collection
    path: src/news/digests
    filename: "{primary}.md"
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Digest title (e.g., 'DIY Filmmaker Digest 8 -- Week of December 8, 2025')."

      - name: date
        label: Date
        type: date
        required: true
        description: "Publication date."

      - name: summary
        label: Short Description
        type: string
        required: true
        description: "One-sentence preview for listings."

      - name: img
        label: Header Image
        type: image
        required: true
        options:
          media: images
          path: src/img/digest/header
        description: "Header image for the digest."

      - name: imgAlt
        label: Header Image Alt Text
        type: string

      - name: author
        label: Author
        type: string

      - name: syndicate
        label: Syndication Targets
        type: select
        options:
          multiple: true
          values:
            - value: substack
              label: Substack
            - value: fediverse
              label: Fediverse

      - name: og_image
        label: Open Graph Image Override
        type: image
        options:
          media: images
          path: src/img

      - name: og_video
        label: Open Graph Video
        type: file
        options:
          media: videos
          path: src/img
          extensions: [mp4, webm]

      - name: og_alt
        label: Open Graph Alt Text
        type: string

      - name: share_text
        label: Social Share Text
        type: text

      - name: body
        label: Digest Content (HTML)
        type: code
        options:
          lang: html
        description: |
          ⚠️ **This is raw HTML** — edit carefully!
          
          Digest posts are auto-generated by scripts.
          Only make small text edits, don't restructure the HTML.
